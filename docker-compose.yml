services:
  lakeze-go:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - lakeze-data:/data
    environment:
      # 選填：有填會當第一次啟動的初始值；之後在後台「設定」頁改
      # PUBLIC_URL: https://your-domain.example.com
      # ADMIN_PASSWORD: change-me
      NODE_ENV: production
    restart: unless-stopped

volumes:
  lakeze-data:
